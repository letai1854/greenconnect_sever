# Spring Boot Application Configuration

server:
  port: ${PORT:8080}  # ← Koyeb sẽ set PORT, local fallback 8080
  # 🔥 QUAN TRỌNG: Lắng nghe trên tất cả network interfaces (0.0.0.0)
  # Điều này cho phép Android Emulator (10.0.2.2) và thiết bị vật lý kết nối được
  address: 0.0.0.0
  # ⭐ TOMCAT CONFIGURATION - Giữ kết nối WebSocket sống lâu hơn
  tomcat:
    connection-timeout: 600000        # 10 phút connection timeout
    keep-alive-timeout: 600000        # 10 phút keep-alive
    max-keep-alive-requests: 1000     # Số request tối đa trên 1 keep-alive connection

spring:
  application:
    name: greenconnect-api
  
  # Database Configuration - Aiven MySQL
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/defaultdb?serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh  # ⭐ QUAN TRỌNG: Lưu/đọc DB theo giờ Việt Nam
    defer-datasource-initialization: true
  
  # Redis Configuration (if using caching)
  # redis:
  #   host: localhost
  #   port: 6379
  #   timeout: 2000ms
  
  # Elasticsearch Configuration - ĐÃ COMMENT OUT (dùng MySQL LIKE thay thế)
  # elasticsearch:
  #   uris: https://0836dcbc12294822963bf23edb74f275.us-central1.gcp.cloud.es.io:443
  #   username: elastic
  #   password: qXO41GO2qgXB0mdzTJw2J9fC
  #   connection-timeout: 30s
  #   socket-timeout: 60s 
    
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

